<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q · Futures Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bg4:#21262d;
  --border:#30363d;--border2:#21262d;
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
  --green:#3fb950;--green2:rgba(63,185,80,.15);--green3:rgba(63,185,80,.07);
  --red:#f85149;--red2:rgba(248,81,73,.15);--red3:rgba(248,81,73,.07);
  --yellow:#e3b341;--blue:#58a6ff;--orange:#d18616;--purple:#bc8cff;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;min-height:100vh}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.logo{font-size:17px;font-weight:800;color:var(--blue);letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.logo em{color:var(--text2);font-style:normal;font-weight:400;font-size:12px;margin-left:6px}

/* BTC / ETH prices in header - 1 dòng */
.hdr-prices{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;flex-shrink:0}
.hdr-coin-name{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.3px}
.hdr-coin-price{font-size:13px;font-weight:700;font-family:'SF Mono','Fira Code',monospace;color:var(--text)}
.hdr-coin-chg{font-size:11px;font-weight:600}
.hdr-divider{color:var(--text3);margin:0 4px;font-size:12px}

.hdr-mid{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s}
.dot.on{background:var(--green);animation:pulse 2s infinite}
.dot.err{background:var(--red)}
.dot.ld{background:var(--yellow)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#status-txt{color:var(--text2);font-size:11px}
.hdr-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.hdr-controls label{color:var(--text2);font-size:11px;white-space:nowrap}
select,button{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px;cursor:pointer}
select:focus{outline:none;border-color:var(--blue)}
.btn-r{border-color:var(--blue);color:var(--blue);font-weight:600;padding:5px 12px}
.btn-r:hover{background:var(--blue);color:#000}
.btn-r:disabled{opacity:.5;cursor:default}
.btn-notif{border-color:var(--text3);color:var(--text2);padding:5px 10px}
.btn-notif.on{border-color:var(--green);color:var(--green)}
.btn-notif.denied{border-color:var(--red);color:var(--red);cursor:not-allowed}

/* ── TABS ── */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;gap:4px}
.tab-btn{padding:9px 20px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--text2);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn .cnt{font-weight:400;font-size:11px;opacity:.6;margin-left:4px}
.tab-btn.long.active{color:var(--green);border-bottom-color:var(--green)}
.tab-btn.short.active{color:var(--red);border-bottom-color:var(--red)}
.tab-btn:not(.active):hover{color:var(--text)}

/* ── CONTENT ── */
.tab-pane{display:none;padding:16px 20px}
.tab-pane.active{display:block}

/* ── CARDS ── */
.cards{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;flex:1;min-width:130px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
.card:hover{border-color:var(--blue)}
.card.active-filter{border-color:var(--blue);background:rgba(88,166,255,.08)}
.card-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text2)}
.card-value{font-size:18px;font-weight:800;margin-top:4px}
.card-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* ── FILTER PANEL ── */
.filter-panel{background:var(--bg3);border:1px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:none}
.filter-panel.open{display:block}
.fp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fp-title{font-size:12px;font-weight:700;color:var(--blue)}
.fp-close{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:0 4px;line-height:1}
.fp-close:hover{color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg4);cursor:pointer;font-size:12px;font-weight:600;transition:all .1s}
.chip:hover{border-color:var(--blue);background:rgba(88,166,255,.1)}
.chip-pct{font-family:'SF Mono',monospace;font-size:11px;opacity:.8}
.fp-empty{color:var(--text2);font-size:12px}

/* ── TABLE ── */
.tbl-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg3)}
th{padding:9px 14px;text-align:right;color:var(--text2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
th:first-child{text-align:left}
tbody tr{border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg4)}
tbody tr.hl-bull{border-left:3px solid var(--green);background:var(--green3)}
tbody tr.hl-bull:hover{background:var(--green2)}
tbody tr.hl-bear{border-left:3px solid var(--red);background:var(--red3)}
tbody tr.hl-bear:hover{background:var(--red2)}
@keyframes rowflash{0%{background:rgba(88,166,255,.35)}100%{background:transparent}}
tbody tr.flash{animation:rowflash 1.8s ease-out}
tbody tr.hl-bull.flash{animation:rowflash 1.8s ease-out}
tbody tr.hl-bear.flash{animation:rowflash 1.8s ease-out}
td{padding:9px 14px;text-align:right;white-space:nowrap;font-size:13px}
td:first-child{text-align:left}

/* ── COIN CELL ── */
.coin-cell{display:flex;align-items:center;gap:8px}
.coin-rank{color:var(--text3);font-size:11px;width:22px;text-align:right;flex-shrink:0}
.coin-base{font-weight:800;font-size:14px;color:var(--text)}
.coin-tag{font-size:10px;color:var(--text3);margin-top:1px}
.tv-link{color:var(--text3);font-size:11px;margin-left:4px;text-decoration:none;vertical-align:middle}
.tv-link:hover{color:var(--blue)}

/* ── COLORS ── */
.up{color:var(--green);font-weight:600}
.dn{color:var(--red);font-weight:600}
.neu{color:var(--text2)}
.mono{font-family:'SF Mono','Fira Code',monospace}

/* ── RSI ── */
.rsi{display:inline-block;padding:2px 6px;border-radius:4px;font-weight:700;font-size:12px;font-family:'SF Mono',monospace}
.rsi-ob{background:var(--red2);color:var(--red)}
.rsi-os{background:var(--green2);color:var(--green)}
.rsi-hi{color:var(--orange)}
.rsi-lo{color:#58c98a}
.rsi-mid{color:var(--text2)}
.rsi-sep{color:var(--text3);margin:0 2px;font-size:11px}

/* ── SIGNAL ── */
.sig{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.sig-bull{background:var(--green2);color:var(--green)}
.sig-bear{background:var(--red2);color:var(--red)}
.sig-none{color:var(--text3)}

/* ── MISC ── */
.empty-row td{text-align:center!important;padding:32px;color:var(--text2)}
.spin{display:inline-block;animation:spin 1s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.filter-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3);border-radius:6px;margin-bottom:8px;font-size:12px;color:var(--blue)}
.filter-bar button{padding:2px 8px;font-size:11px;border-color:var(--blue);color:var(--blue)}
.filter-bar button:hover{background:var(--blue);color:#000}

@media(max-width:768px){
  .hdr{padding:8px 12px;gap:8px}
  .hdr-prices{gap:10px}
  .tab-pane{padding:10px 12px}
  th,td{padding:7px 8px;font-size:12px}
  .cards{gap:8px}
  .card{min-width:110px;padding:8px 10px}
  .card-value{font-size:15px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">Q<em>· Futures Scanner</em></div>

  <!-- BTC / ETH realtime - 1 dòng -->
  <div class="hdr-prices">
    <span class="hdr-coin-name">BTC</span>
    <span class="hdr-coin-price" id="hdr-btc-price">—</span>
    <span class="hdr-coin-chg" id="hdr-btc-chg"></span>
    <span class="hdr-divider">|</span>
    <span class="hdr-coin-name">ETH</span>
    <span class="hdr-coin-price" id="hdr-eth-price">—</span>
    <span class="hdr-coin-chg" id="hdr-eth-chg"></span>
  </div>

  <div class="hdr-mid">
    <div class="dot" id="dot"></div>
    <span id="status-txt">Chưa tải dữ liệu</span>
  </div>
  <div class="hdr-controls">
    <label>Top</label>
    <select id="topN">
      <option value="20">20</option>
      <option value="30" selected>30</option>
      <option value="50">50</option>
    </select>
    <label>Vol min</label>
    <select id="minVol">
      <option value="10">$10M+</option>
      <option value="50" selected>$50M+</option>
      <option value="100">$100M+</option>
      <option value="500">$500M+</option>
    </select>
    <button class="btn-r" id="btn-r" onclick="refresh()">↻ Làm mới</button>
    <button class="btn-notif" id="btn-notif" onclick="toggleNotif()" title="Bật/tắt thông báo Chrome">🔔 Thông báo</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn short active" onclick="switchTab('short')">
    📉 SHORT <span class="cnt" id="short-cnt"></span>
  </button>
  <button class="tab-btn long" onclick="switchTab('long')">
    📈 LONG <span class="cnt" id="long-cnt"></span>
  </button>
</div>

<!-- TAB LONG -->
<div class="tab-pane" id="pane-long">
  <div class="cards" id="cards-long">
    <div class="card" id="card-l-os" onclick="toggleFilter('long','os')">
      <div class="card-label">🟢 RSI &lt; 20 (Quá bán)</div>
      <div class="card-value" id="l-os" style="color:var(--green)">—</div>
      <div class="card-sub">bấm để xem coin</div>
    </div>
    <div class="card" style="cursor:default">
      <div class="card-label">Giảm mạnh nhất 24h</div>
      <div class="card-value" id="l-top24" style="color:var(--red)">—</div>
      <div class="card-sub" id="l-top24-sub"></div>
    </div>
    <div class="card" style="cursor:default">
      <div class="card-label">Giảm mạnh nhất 5m</div>
      <div class="card-value" id="l-top5m" style="color:var(--red)">—</div>
      <div class="card-sub" id="l-top5m-sub"></div>
    </div>
  </div>
  <!-- Filter panel -->
  <div class="filter-panel" id="fp-long">
    <div class="fp-header">
      <span class="fp-title" id="fp-long-title"></span>
      <button class="fp-close" onclick="closeFilter('long')">✕</button>
    </div>
    <div class="chips" id="fp-long-chips"></div>
  </div>
  <!-- Table -->
  <div id="filter-bar-long"></div>
  <div class="tbl-wrap">
    <table>
      <thead id="long-thead"></thead>
      <tbody id="long-tbody">
        <tr class="empty-row"><td colspan="8">Nhấn ↻ Làm mới để tải dữ liệu</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- TAB SHORT (active mặc định) -->
<div class="tab-pane active" id="pane-short">
  <div class="cards" id="cards-short">
    <div class="card" id="card-s-ob" onclick="toggleFilter('short','ob')">
      <div class="card-label">🔴 RSI &gt; 90 (Quá mua)</div>
      <div class="card-value" id="s-ob" style="color:var(--red)">—</div>
      <div class="card-sub">bấm để xem coin</div>
    </div>
    <div class="card" style="cursor:default">
      <div class="card-label">Tăng mạnh nhất 24h</div>
      <div class="card-value" id="s-top24" style="color:var(--green)">—</div>
      <div class="card-sub" id="s-top24-sub"></div>
    </div>
    <div class="card" style="cursor:default">
      <div class="card-label">Tăng mạnh nhất 5m</div>
      <div class="card-value" id="s-top5m" style="color:var(--green)">—</div>
      <div class="card-sub" id="s-top5m-sub"></div>
    </div>
  </div>
  <div class="filter-panel" id="fp-short">
    <div class="fp-header">
      <span class="fp-title" id="fp-short-title"></span>
      <button class="fp-close" onclick="closeFilter('short')">✕</button>
    </div>
    <div class="chips" id="fp-short-chips"></div>
  </div>
  <div id="filter-bar-short"></div>
  <div class="tbl-wrap">
    <table>
      <thead id="short-thead"></thead>
      <tbody id="short-tbody">
        <tr class="empty-row"><td colspan="8">Nhấn ↻ Làm mới để tải dữ liệu</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ═══════════════════════════════
//  STATE
// ═══════════════════════════════
const S = {
  longList:[], shortList:[],
  details:{},
  validPerps: null,
  loading:false,
  timer:null,
  activeFilter:{ long:null, short:null },
  notifEnabled: localStorage.getItem('notif')==='1',
  prevSignals: {}  // { symbol: { divergence, rsiOB, rsiOS } }
};

// ═══════════════════════════════
//  SETTINGS
// ═══════════════════════════════
function cfg(){
  return {
    topN:    parseInt(document.getElementById('topN').value),
    minVolM: parseInt(document.getElementById('minVol').value),
    rsiPer:  14,
  };
}

// ═══════════════════════════════
//  RSI(14)
// ═══════════════════════════════
// ─── RSI single value ───
function calcRSI(closes, n){
  if(closes.length < n+1) return null;
  let g=0,l=0;
  for(let i=1;i<=n;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d;}
  let ag=g/n,al=l/n;
  for(let i=n+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    ag=(ag*(n-1)+Math.max(d,0))/n;
    al=(al*(n-1)+Math.max(-d,0))/n;
  }
  if(al===0) return 100;
  return parseFloat((100-100/(1+ag/al)).toFixed(2));
}

// ═══════════════════════════════
//  FETCH VALID PERPS (chỉ lấy coin thực tế có trên Binance Futures)
// ═══════════════════════════════
async function fetchValidPerps(){
  const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
  const data = await res.json();
  return new Set(
    data.symbols
      .filter(s => s.contractType==='PERPETUAL' && s.status==='TRADING' && s.quoteAsset==='USDT')
      .map(s => s.symbol)
  );
}

// ═══════════════════════════════
//  FETCH TICKERS
// ═══════════════════════════════
async function fetchTickers(){
  const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
  const data = await res.json();
  const c = cfg();
  const stables = new Set(['USDC','BUSD','TUSD','FDUSD','DAI','USDP','USTC','USDD']);

  return data
    .filter(t =>
      t.symbol.endsWith('USDT') &&
      S.validPerps.has(t.symbol) &&            // phải có trong danh sách hợp lệ
      !stables.has(t.symbol.replace('USDT','')) &&
      parseFloat(t.quoteVolume) >= c.minVolM*1e6
    )
    .map(t => ({
      symbol:    t.symbol,
      base:      t.symbol.replace('USDT',''),
      price:     parseFloat(t.lastPrice),
      change24h: parseFloat(t.priceChangePercent),
      volM:      parseFloat(t.quoteVolume)/1e6,
    }));
}

// ═══════════════════════════════
//  UPDATE HEADER BTC/ETH
// ═══════════════════════════════
function updateHeaderPrices(allTickers){
  ['BTC','ETH'].forEach(base => {
    const t = allTickers.find(x=>x.symbol===base+'USDT');
    if(!t) return;
    const side = base.toLowerCase();
    const priceEl = document.getElementById(`hdr-${side}-price`);
    const chgEl   = document.getElementById(`hdr-${side}-chg`);
    priceEl.textContent = fPrice(t.price);
    chgEl.textContent   = fPct(t.change24h);
    chgEl.className = 'hdr-coin-chg ' + (t.change24h>=0?'up':'dn');
  });
}

// ═══════════════════════════════
//  FETCH DETAILS (klines 5m)
// ═══════════════════════════════
async function fetchDetails(symbol, price){
  try{
    const N = 14;
    const LIM = N + 5; // 19 nến đủ để tính RSI(14)

    // Fetch 2 khung thời gian song song
    const [k5m, k15m] = await Promise.all([
      fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=5m&limit=28`).then(r=>r.json()),
      fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=${LIM}`).then(r=>r.json()),
    ]);

    const rsiOf = (klines) => {
      if(!Array.isArray(klines)||klines.length<N+2) return null;
      const cc = klines.slice(0,-1).map(k=>parseFloat(k[4]));
      if(cc.length<N+1) return null;
      return calcRSI([...cc, price], N);
    };

    const rsi5m  = rsiOf(k5m);
    const rsi15m = rsiOf(k15m);

    // % 5m và % 1h từ klines 5m
    const cc5 = Array.isArray(k5m) ? k5m.slice(0,-1).map(k=>parseFloat(k[4])) : [];
    const prevClose = cc5.length ? cc5[cc5.length-1] : price;
    const chg5m = prevClose>0 ? (price-prevClose)/prevClose*100 : 0;
    const ref1h = cc5.length>=13 ? cc5[cc5.length-13] : cc5[0];
    const chg1h = ref1h>0 ? (price-ref1h)/ref1h*100 : 0;

    return { rsi5m, rsi15m, chg5m, chg1h };
  }catch(e){ return null; }
}

// ═══════════════════════════════
//  FORMAT
// ═══════════════════════════════
function fPct(v,d=2){
  if(v==null)return'—';
  return(v>=0?'+':'')+v.toFixed(d)+'%';
}
function fPrice(p){
  if(p>=10000)return p.toLocaleString('en',{maximumFractionDigits:1});
  if(p>=100)  return p.toFixed(2);
  if(p>=1)    return p.toFixed(3);
  if(p>=0.01) return p.toFixed(4);
  return p.toFixed(6);
}
function fVol(m){
  return m>=1000?'$'+(m/1000).toFixed(1)+'B':'$'+Math.round(m)+'M';
}
function pCls(v){return v>0?'up':v<0?'dn':'neu';}

// RSI badge — ngưỡng cứng 90/20
function rsiTag(rsi){
  if(rsi==null) return '<span class="rsi rsi-mid">...</span>';
  const cls = rsi>90?'rsi-ob':rsi<20?'rsi-os':rsi>=60?'rsi-hi':rsi<=40?'rsi-lo':'rsi-mid';
  return `<span class="rsi ${cls}">${rsi.toFixed(1)}</span>`;
}

// Tín hiệu: liệt kê TF nào vượt ngưỡng
function sigBadge(det){
  if(!det) return '<span class="sig-none">...</span>';
  const TFS = ['5m','15m'];
  const VALS = [det.rsi5m, det.rsi15m];
  const ob = TFS.filter((_,i)=>VALS[i]!=null&&VALS[i]>90);
  const os = TFS.filter((_,i)=>VALS[i]!=null&&VALS[i]<20);
  if(ob.length) return `<span class="sig sig-bear">🔴 ${ob.join(' · ')}</span>`;
  if(os.length) return `<span class="sig sig-bull">🟢 ${os.join(' · ')}</span>`;
  return '<span class="sig-none">—</span>';
}

function hasSignal(det, side){
  if(!det) return false;
  const v = [det.rsi5m, det.rsi15m];
  return side==='short' ? v.some(r=>r!=null&&r>90) : v.some(r=>r!=null&&r<20);
}

// ═══════════════════════════════
//  SCROLL & HIGHLIGHT ROW
// ═══════════════════════════════
function scrollToRow(symbol){
  const row = document.getElementById('row-'+symbol);
  if(!row) return;
  row.scrollIntoView({behavior:'smooth', block:'center'});
  row.classList.remove('flash');
  void row.offsetWidth;
  row.classList.add('flash');
  setTimeout(()=>row.classList.remove('flash'), 2000);
}

// ═══════════════════════════════
//  FILTER PANEL
// ═══════════════════════════════
function toggleFilter(side, type){
  const current = S.activeFilter[side];
  if(current===type){closeFilter(side);return;}
  S.activeFilter[side]=type;

  document.querySelectorAll(`#cards-${side} .card`).forEach(c=>c.classList.remove('active-filter'));
  const cardId = side==='long'?'card-l-os':'card-s-ob';
  document.getElementById(cardId)?.classList.add('active-filter');

  const list = side==='long'?S.longList:S.shortList;
  let matching, title;
  if(type==='os'){
    matching = list.filter(x=>hasSignal(S.details[x.symbol],'long'));
    title='🟢 RSI < 20 (Quá bán)';
  }else{
    matching = list.filter(x=>hasSignal(S.details[x.symbol],'short'));
    title='🔴 RSI > 90 (Quá mua)';
  }

  document.getElementById(`fp-${side}-title`).textContent=`${title} · ${matching.length} coin`;
  const chipsEl=document.getElementById(`fp-${side}-chips`);
  if(!matching.length){
    chipsEl.innerHTML='<span class="fp-empty">Không có coin nào đáp ứng điều kiện này.</span>';
  }else{
    chipsEl.innerHTML=matching.map(x=>{
      const d=S.details[x.symbol];
      const rsiLine = d ? `<span class="chip-pct">${['5m','15m'].map((tf,i)=>{
        const v=[d.rsi5m,d.rsi15m][i];
        return v!=null?`<span style="font-size:10px;color:var(--text2)">${tf}:</span>${rsiTag(v)}`:'';
      }).join(' ')}</span>` : '';
      return`<div class="chip" onclick="scrollToRow('${x.symbol}')">
        <span>${x.base}</span>
        <span class="chip-pct ${pCls(x.change24h)}">${fPct(x.change24h)}</span>
        ${rsiLine}
      </div>`;
    }).join('');
  }
  document.getElementById(`fp-${side}`).classList.add('open');
}

function closeFilter(side){
  S.activeFilter[side]=null;
  document.getElementById(`fp-${side}`).classList.remove('open');
  document.querySelectorAll(`#cards-${side} .card`).forEach(c=>c.classList.remove('active-filter'));
}

// ═══════════════════════════════
//  RENDER TABLE
// ═══════════════════════════════
const THEAD=`<tr>
  <th style="text-align:left;min-width:130px">Coin</th>
  <th>Giá USDT</th>
  <th title="Biến động 5 phút">% 5m</th>
  <th title="Biến động 1 giờ">% 1h</th>
  <th title="Biến động 24 giờ">% 24h</th>
  <th title="RSI(14) khung 5 phút">RSI 5m</th>
  <th title="RSI(14) khung 15 phút">RSI 15m</th>
  <th title="Tín hiệu: RSI > 90 hoặc < 20">Tín hiệu</th>
  <th title="Khối lượng 24h">KL 24h</th>
</tr>`;

function renderTable(side, list){
  document.getElementById(`${side}-thead`).innerHTML=THEAD;
  const tbody=document.getElementById(`${side}-tbody`);
  if(!list.length){
    tbody.innerHTML='<tr class="empty-row"><td colspan="9">Không có dữ liệu</td></tr>';
    return;
  }

  const sorted=[
    ...list.filter(c=>hasSignal(S.details[c.symbol], side)),
    ...list.filter(c=>!hasSignal(S.details[c.symbol], side)),
  ];

  tbody.innerHTML=sorted.map((c,i)=>{
    const det=S.details[c.symbol];
    const tv=`https://www.tradingview.com/chart/?symbol=BINANCE:${c.symbol}.P`;
    const chg5m=det?.chg5m??null;
    const chg1h=det?.chg1h??null;
    const hlCls = hasSignal(det,side) ? (side==='short'?'hl-bear':'hl-bull') : '';
    const loading='<span class="rsi rsi-mid">...</span>';

    return`<tr id="row-${c.symbol}" class="${hlCls}">
      <td>
        <div class="coin-cell">
          <span class="coin-rank">${i+1}</span>
          <div>
            <div class="coin-base">
              ${c.base}
              <a class="tv-link" href="${tv}" target="_blank" onclick="event.stopPropagation()" title="Mở TradingView">↗</a>
            </div>
            <div class="coin-tag">USDT · PERP</div>
          </div>
        </div>
      </td>
      <td class="mono">${fPrice(c.price)}</td>
      <td class="${pCls(chg5m)}">${chg5m==null?'...':fPct(chg5m)}</td>
      <td class="${pCls(chg1h)}">${chg1h==null?'...':fPct(chg1h)}</td>
      <td class="${pCls(c.change24h)}" style="font-weight:700">${fPct(c.change24h)}</td>
      <td>${det?rsiTag(det.rsi5m):loading}</td>
      <td>${det?rsiTag(det.rsi15m):loading}</td>
      <td>${sigBadge(det)}</td>
      <td class="neu mono">${fVol(c.volM)}</td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════
//  SUMMARY CARDS
// ═══════════════════════════════
function updateCards(side,list){
  if(side==='long'){
    const os=list.filter(c=>hasSignal(S.details[c.symbol],'long')).length;
    const t24=list.length?list.reduce((a,b)=>b.change24h<a.change24h?b:a):null;
    const b5=list.filter(x=>S.details[x.symbol]);
    const t5m=b5.length?b5.reduce((a,b)=>S.details[b.symbol].chg5m<S.details[a.symbol].chg5m?b:a):null;
    document.getElementById('l-os').textContent=os?`${os} coin`:'0';
    document.getElementById('l-top24').textContent=t24?fPct(t24.change24h):'—';
    document.getElementById('l-top24-sub').textContent=t24?t24.base:'';
    document.getElementById('l-top5m').textContent=t5m?fPct(S.details[t5m.symbol].chg5m):'—';
    document.getElementById('l-top5m-sub').textContent=t5m?t5m.base:'';
    document.getElementById('long-cnt').textContent=`(${list.length})`;
  }else{
    const ob=list.filter(c=>hasSignal(S.details[c.symbol],'short')).length;
    const t24=list.length?list.reduce((a,b)=>b.change24h>a.change24h?b:a):null;
    const b5=list.filter(x=>S.details[x.symbol]);
    const t5m=b5.length?b5.reduce((a,b)=>S.details[b.symbol].chg5m>S.details[a.symbol].chg5m?b:a):null;
    document.getElementById('s-ob').textContent=ob?`${ob} coin`:'0';
    document.getElementById('s-top24').textContent=t24?fPct(t24.change24h):'—';
    document.getElementById('s-top24-sub').textContent=t24?t24.base:'';
    document.getElementById('s-top5m').textContent=t5m?fPct(S.details[t5m.symbol].chg5m):'—';
    document.getElementById('s-top5m-sub').textContent=t5m?t5m.base:'';
    document.getElementById('short-cnt').textContent=`(${list.length})`;
  }
  if(S.activeFilter[side]) toggleFilter(side, S.activeFilter[side]);
}

// ═══════════════════════════════
//  MAIN REFRESH
// ═══════════════════════════════
async function refresh(){
  if(S.loading)return;
  S.loading=true;
  clearTimeout(S.timer);
  const dot=document.getElementById('dot');
  const txt=document.getElementById('status-txt');
  const btn=document.getElementById('btn-r');
  dot.className='dot ld';
  txt.textContent='Đang tải...';
  btn.disabled=true;
  ['long','short'].forEach(side=>{
    document.getElementById(`${side}-tbody`).innerHTML=
      `<tr class="empty-row"><td colspan="8"><span class="spin">⟳</span> Đang tải từ Binance Futures...</td></tr>`;
  });
  try{
    // 1. Lấy danh sách perp hợp lệ (cache lại, không fetch lại mỗi lần)
    if(!S.validPerps){
      txt.textContent='Đang xác thực danh sách Futures...';
      S.validPerps=await fetchValidPerps();
    }

    // 2. Tickers
    txt.textContent='Đang tải giá...';
    const all=await fetchTickers();

    // Cập nhật BTC/ETH header
    updateHeaderPrices(all);

    const c=cfg();
    // LONG: giảm mạnh nhất → cơ hội Long
    S.longList =[...all].sort((a,b)=>a.change24h-b.change24h).slice(0,c.topN);
    // SHORT: tăng mạnh nhất → cơ hội Short
    S.shortList=[...all].sort((a,b)=>b.change24h-a.change24h).slice(0,c.topN);

    renderTable('long',S.longList);
    renderTable('short',S.shortList);
    updateCards('long',S.longList);
    updateCards('short',S.shortList);
    txt.textContent=`Đang tính RSI(14)...`;

    // 3. Details - unique coins, batch 10
    const uniq=[...new Map(
      [...S.longList,...S.shortList].map(c=>[c.symbol,c])
    ).values()];

    for(let i=0;i<uniq.length;i+=10){
      await Promise.all(
        uniq.slice(i,i+10).map(async c=>{
          const d=await fetchDetails(c.symbol,c.price);
          if(d) S.details[c.symbol]=d;
        })
      );
      renderTable('long',S.longList);
      renderTable('short',S.shortList);
      updateCards('long',S.longList);
      updateCards('short',S.shortList);
    }

    // Kiểm tra tín hiệu mới và gửi thông báo
    checkSignals(S.shortList,'short');
    checkSignals(S.longList,'long');

    const now=new Date();
    dot.className='dot on';
    txt.textContent=`Cập nhật ${now.toLocaleTimeString('vi-VN')} · Tự làm mới sau 30s`;
    S.timer=setTimeout(refresh,30000);
  }catch(e){
    dot.className='dot err';
    txt.textContent='❌ Lỗi kết nối Binance (thử VPN nếu bị chặn)';
    console.error(e);
  }
  btn.disabled=false;
  S.loading=false;
}

// ═══════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════
function updateNotifBtn(){
  const btn = document.getElementById('btn-notif');
  if(!('Notification' in window)){
    btn.textContent='🔕 Không hỗ trợ';
    btn.classList.add('denied');
    return;
  }
  if(Notification.permission==='denied'){
    btn.textContent='🔕 Bị chặn';
    btn.classList.add('denied');
    btn.title='Vào Settings > Privacy > Notifications để bật lại';
    return;
  }
  if(S.notifEnabled && Notification.permission==='granted'){
    btn.textContent='🔔 Đang bật';
    btn.className='btn-notif on';
  }else{
    btn.textContent='🔕 Thông báo';
    btn.className='btn-notif';
  }
}

async function toggleNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='denied'){
    alert('Chrome đang chặn thông báo từ trang này.\n\nĐể bật lại:\n1. Click icon 🔒 bên trái địa chỉ web\n2. Notifications → Allow\n3. Reload trang');
    return;
  }
  if(!S.notifEnabled){
    const perm = await Notification.requestPermission();
    if(perm==='granted'){
      S.notifEnabled=true;
      localStorage.setItem('notif','1');
      // Test notification
      new Notification('Q · Futures Scanner 🔔', {
        body: 'Thông báo đã được bật! Bạn sẽ nhận cảnh báo khi có tín hiệu Đảo chiều, Quá mua, Quá bán.',
        icon: 'https://favi.one/b.png'
      });
    }
  }else{
    S.notifEnabled=false;
    localStorage.setItem('notif','0');
  }
  updateNotifBtn();
}

function sendNotif(title, body, tag){
  if(!S.notifEnabled || Notification.permission!=='granted') return;
  try{
    const n = new Notification(title, { body, tag, renotify:true, icon:'https://favi.one/b.png' });
    n.onclick=()=>{ window.focus(); n.close(); };
  }catch(e){}
}

function checkSignals(list, side){
  const TFS = ['5m','15m'];
  list.forEach(coin=>{
    const det = S.details[coin.symbol];
    if(!det) return;
    const prev = S.prevSignals[coin.symbol] || {};

    const vals = [det.rsi5m, det.rsi15m];
    const obTfs = TFS.filter((_,i)=>vals[i]!=null&&vals[i]>90);
    const osTfs = TFS.filter((_,i)=>vals[i]!=null&&vals[i]<20);
    const prevOb = prev.obTfs||'';
    const prevOs = prev.osTfs||'';

    if(obTfs.length && obTfs.join()!==prevOb && side==='short'){
      sendNotif(
        `🔴 RSI Quá mua · ${coin.base}`,
        `Khung ${obTfs.join(', ')} vượt 90 · Giá ${fPrice(coin.price)} · % 24h ${fPct(coin.change24h)}`,
        `ob-${coin.symbol}`
      );
    }
    if(osTfs.length && osTfs.join()!==prevOs && side==='long'){
      sendNotif(
        `🟢 RSI Quá bán · ${coin.base}`,
        `Khung ${osTfs.join(', ')} xuống dưới 20 · Giá ${fPrice(coin.price)} · % 24h ${fPct(coin.change24h)}`,
        `os-${coin.symbol}`
      );
    }

    S.prevSignals[coin.symbol] = { obTfs: obTfs.join(), osTfs: osTfs.join() };
  });
}

// ═══════════════════════════════
//  TAB SWITCH
// ═══════════════════════════════
function switchTab(side){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelector(`.tab-btn.${side}`).classList.add('active');
  document.getElementById(`pane-${side}`).classList.add('active');
}

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
updateNotifBtn();
refresh();
</script>
