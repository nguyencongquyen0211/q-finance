<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp 4B2 · Họp Phụ Huynh 2025–2026</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#1a0a0a;overflow:hidden;height:100vh}

/* ── SLIDESHOW ── */
#deck{
  width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
  transform:translateX(60px);
}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.slide.exit-left{opacity:0;transform:translateX(-60px)}
.slide.exit-right{opacity:0;transform:translateX(60px)}

/* ── SLIDE INNER ── */
.slide-inner{
  width:min(96vw,1280px);
  height:min(96vh,720px);
  position:relative;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

/* ── NAVIGATION ── */
.nav-btn{
  position:fixed;top:50%;z-index:100;
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);
  border:2px solid rgba(255,255,255,.3);
  color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;transform:translateY(-50%);
  user-select:none;
}
.nav-btn:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.1)}
#prev{left:16px}
#next{right:16px}

/* Dots */
#dots{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;flex-wrap:wrap;max-width:90vw;
  justify-content:center;z-index:100;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.3);cursor:pointer;
  transition:all .2s;
}
.dot.active{background:#fff;transform:scale(1.4)}
.dot:hover{background:rgba(255,255,255,.7)}

/* Counter */
#counter{
  position:fixed;top:14px;right:60px;
  color:rgba(255,255,255,.6);font-size:13px;font-weight:700;
  z-index:100;
}

/* Keyboard hint */
#hint{
  position:fixed;bottom:40px;right:16px;
  color:rgba(255,255,255,.4);font-size:11px;font-weight:600;
}

/* ── SLIDE TYPE: FULL IMAGE ── */
.slide-img{
  width:100%;height:100%;object-fit:cover;display:block;
}

/* ── SLIDE TYPE: TITLE ── */
.slide-title{
  width:100%;height:100%;
  background:linear-gradient(135deg,#FBF4E4 0%,#F0E8D5 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px;text-align:center;
  position:relative;overflow:hidden;
}
.slide-title::before{
  content:'';position:absolute;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(156,178,134,.3),transparent 70%);
  top:-100px;right:-100px;
}
.slide-title::after{
  content:'';position:absolute;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,129,129,.2),transparent 70%);
  bottom:-80px;left:-80px;
}
.title-logo{height:56px;margin-bottom:20px;position:relative;z-index:1}
.title-school{font-size:clamp(13px,1.8vw,18px);font-weight:700;color:#7C6C50;letter-spacing:.5px;margin-bottom:12px;position:relative;z-index:1}
.title-event{font-size:clamp(24px,3.5vw,42px);font-weight:900;color:#C85A5A;line-height:1.2;margin-bottom:16px;position:relative;z-index:1}
.title-class{
  display:inline-block;
  background:linear-gradient(135deg,#9CB286,#7A9B66);
  color:#fff;font-size:clamp(28px,4vw,52px);font-weight:900;
  padding:8px 32px;border-radius:99px;
  box-shadow:0 6px 20px rgba(156,178,134,.4);
  position:relative;z-index:1;margin-bottom:16px;
}
.title-year{font-size:clamp(16px,2vw,22px);font-weight:700;color:#B08050;position:relative;z-index:1}
.title-photo{
  position:absolute;bottom:0;right:0;
  height:75%;object-fit:contain;opacity:.2;
  z-index:0;
}

/* ── SLIDE TYPE: POEM (student) ── */
.slide-poem{
  width:100%;height:100%;
  background:linear-gradient(135deg,#FBF4E4 0%,#F5EDD5 100%);
  display:grid;
  grid-template-columns:1fr 1fr;
  position:relative;overflow:hidden;
}
.poem-photos{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:28px 20px 28px 32px;
  position:relative;
}
.poem-photo-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.photo-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.photo-frame{
  border-radius:50%;overflow:hidden;
  border:4px solid;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  flex-shrink:0;
}
.photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
.photo-name{
  font-size:12px;font-weight:800;
  padding:2px 10px;border-radius:99px;
  white-space:nowrap;
}
.poem-text-side{
  display:flex;flex-direction:column;justify-content:center;
  padding:28px 32px 28px 20px;
  position:relative;z-index:1;
}
.poem-num{
  font-size:72px;font-weight:900;opacity:.08;
  position:absolute;top:16px;right:24px;
  line-height:1;
}
.poem-lines{
  font-size:clamp(14px,1.8vw,20px);
  line-height:2;font-weight:600;
  color:#4A3A2A;white-space:pre-line;
}
/* Decorative circles */
.deco-circle{
  position:absolute;border-radius:50%;opacity:.3;
}

/* ── SLIDE TYPE: OPENING POEM ── */
.slide-open-poem{
  width:100%;height:100%;
  background:#FBF4E4;
  display:grid;grid-template-columns:1fr 1fr;
  position:relative;
}
.open-photo{width:100%;height:100%;object-fit:cover;opacity:.7}
.open-text{
  display:flex;flex-direction:column;justify-content:center;
  padding:40px 40px 40px 32px;
  background:rgba(251,244,228,.95);
}
.open-text p{
  font-size:clamp(15px,1.8vw,20px);
  line-height:2;font-weight:600;color:#4A3A2A;
  white-space:pre-line;
}

/* ── SLIDE TYPE: HONOR ── */
.slide-honor{
  width:100%;height:100%;
  background:linear-gradient(135deg,#FBF4E4,#F0E8D5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
  position:relative;overflow:hidden;
}
.honor-badge{
  font-size:clamp(20px,3vw,36px);font-weight:900;
  color:#9CB286;letter-spacing:2px;margin-bottom:12px;
}
.honor-title{
  font-size:clamp(26px,4vw,52px);font-weight:900;
  color:#8B7355;margin-bottom:8px;
}
.honor-year{font-size:clamp(14px,2vw,20px);color:#B08050;font-weight:700}
.honor-stars{font-size:2.5rem;margin-top:20px;letter-spacing:10px;animation:sparkle 2s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}

/* ── SLIDE TYPE: QUIZ ── */
.slide-quiz-title{
  width:100%;height:100%;
  background:linear-gradient(135deg,#9CB286 0%,#7A9B66 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
}
.slide-quiz-title h2{
  font-size:clamp(18px,3vw,36px);font-weight:800;color:rgba(255,255,255,.9);
  margin-bottom:20px;letter-spacing:1px;
}
.slide-quiz-title h1{
  font-size:clamp(32px,6vw,80px);font-weight:900;color:#fff;
  line-height:1.1;text-shadow:0 4px 20px rgba(0,0,0,.2);
}

.slide-quiz-q{
  width:100%;height:100%;
  background:#FBF4E4;
  display:flex;flex-direction:column;
  padding:28px 36px;
  position:relative;overflow:hidden;
}
.quiz-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.quiz-num{
  background:#9CB286;color:#fff;
  font-size:13px;font-weight:800;
  padding:4px 14px;border-radius:99px;letter-spacing:.5px;
}
.quiz-timer-area{display:flex;align-items:center;gap:10px}
.q-text{
  font-size:clamp(16px,2.5vw,26px);font-weight:800;
  color:#4A3A2A;line-height:1.4;margin-bottom:20px;
  text-align:center;
}
.quiz-opts{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:12px;flex:1;max-height:280px;
}
.q-opt{
  background:#fff;border:3px solid #E8DCC8;
  border-radius:16px;padding:16px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;transition:all .2s;text-align:center;
}
.q-opt:hover{border-color:#9CB286;transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.q-opt .opt-letter{
  width:34px;height:34px;border-radius:50%;
  background:#E8DCC8;color:#8B7355;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0;
}
.q-opt .opt-text{
  font-size:clamp(13px,1.6vw,17px);font-weight:700;color:#4A3A2A;line-height:1.3;
}
.q-opt.correct{background:#d4edda;border-color:#9CB286;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
.q-opt.correct .opt-letter{background:#9CB286;color:#fff}
.q-opt.wrong{background:#fde8e8;border-color:#FC8181;opacity:.7}
.q-opt.wrong .opt-letter{background:#FC8181;color:#fff}
.q-opt.revealed{background:#EBF5E4;border-color:#9CB286}
.q-opt.revealed .opt-letter{background:#9CB286;color:#fff}
@keyframes popIn{0%{transform:scale(.95)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

.quiz-footer{
  display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;
}
.q-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:10px;border:none;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  cursor:pointer;transition:all .2s;
}
.btn-time{background:#FFBD59;color:#7A5A0A}
.btn-time:hover{background:#F0A800;color:#fff}
.btn-time.running{animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,189,89,.4)}50%{box-shadow:0 0 0 8px rgba(255,189,89,0)}}
.btn-reveal{background:#E8DCC8;color:#8B7355}
.btn-reveal:hover{background:#9CB286;color:#fff}
.timer-val{
  font-size:20px;font-weight:900;
  color:#FFBD59;min-width:50px;text-align:center;
}
.timer-val.warn{color:#FC8181;animation:blink .5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.quiz-msg{
  font-size:14px;font-weight:700;
  padding:8px 16px;border-radius:10px;
  display:none;
}
.quiz-msg.show{display:block}
.quiz-msg.ok{background:#d4edda;color:#2d6a4f}
.quiz-msg.hint{background:#d0e8fa;color:#1e4d78}

/* ── SLIDE VIDEO/PH ── */
.slide-closing{
  width:100%;height:100%;
  background:linear-gradient(135deg,#4A3A2A,#2A1A0A);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
  position:relative;overflow:hidden;
}
.slide-closing h2{font-size:clamp(14px,2vw,20px);color:rgba(255,255,255,.6);font-weight:700;margin-bottom:12px;letter-spacing:1px}
.slide-closing h1{font-size:clamp(26px,4vw,52px);font-weight:900;color:#FFBD59;margin-bottom:20px}
.slide-closing p{font-size:clamp(14px,1.8vw,18px);color:rgba(255,255,255,.7);font-weight:600;max-width:500px;line-height:1.7}
.closing-icon{font-size:5rem;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .slide-poem{grid-template-columns:1fr}
  .poem-photos{padding:16px;max-height:220px;justify-content:center}
  .poem-photo-row{gap:8px}
  .poem-text-side{padding:12px 20px 20px}
  .poem-lines{font-size:13px;line-height:1.8}
  .quiz-opts{grid-template-columns:1fr;max-height:none}
  .slide-poem .poem-text-side{display:none}
  .slide-open-poem{grid-template-columns:1fr}
  .open-photo{display:none}
}
</style>
</head>

// ═══════════════════════════════
//  BUILD SLIDES
// ═══════════════════════════════
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');

function buildSlide(data, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'slide';
  wrap.id = `slide-${idx}`;

  const inner = document.createElement('div');
  inner.className = 'slide-inner';

  switch(data.type) {
    case 'title':
      inner.innerHTML = `
        <div class="slide-title">
          <img src="images/logo.png" class="title-logo" alt="Vinschool">
          <div class="title-school">Trường Tiểu học Vinschool Ocean Park</div>
          <div class="title-event">HỌP PHỤ HUYNH HỌC SINH</div>
          <div class="title-class">Lớp 4B2</div>
          <div class="title-year">Năm học 2025 – 2026</div>
        </div>`;
      break;

    case 'img':
      inner.innerHTML = `<img src="${data.src}" alt="${data.alt}" class="slide-img">`;
      break;

    case 'open-poem':
      inner.innerHTML = `
        <div class="slide-open-poem">
          <img src="${data.photo}" class="open-photo" alt="">
          <div class="open-text"><p>${data.text}</p></div>
        </div>`;
      break;

    case 'poem': {
      const n = data.students.length;
      const photoSize = n >= 4 ? 90 : n === 3 ? 110 : n === 2 ? 130 : 160;
      const photos = data.students.map((s,i) => `
        <div class="photo-wrap">
          <div class="photo-frame" style="width:${photoSize}px;height:${photoSize}px;border-color:${data.colors[i%data.colors.length]}">
            <img src="${s.photo}" alt="${s.name}" loading="lazy">
          </div>
          <span class="photo-name" style="background:${data.colors[i%data.colors.length]}20;color:${data.colors[i%data.colors.length]}">${s.name}</span>
        </div>`).join('');

      inner.innerHTML = `
        <div class="slide-poem">
          <div class="deco-circle" style="width:180px;height:180px;background:${data.colors[0]};top:-60px;left:-60px"></div>
          <div class="deco-circle" style="width:120px;height:120px;background:${(data.colors[1]||data.colors[0])};bottom:-40px;right:40px"></div>
          <div class="poem-photos">
            <div class="poem-photo-row">${photos}</div>
          </div>
          <div class="poem-text-side">
            <div class="poem-num">${data.num}</div>
            <div class="poem-lines">${data.text}</div>
          </div>
        </div>`;
      break;
    }

    case 'honor':
      inner.innerHTML = `
        <div class="slide-honor">
          <div style="position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,${data.color}22,transparent);top:-100px;right:-100px"></div>
          <div class="honor-badge" style="color:${data.color}">✦ ${data.badge} ✦</div>
          <div class="honor-title">${data.title}</div>
          <div class="honor-year">${data.year}</div>
          <div class="honor-stars">⭐⭐⭐⭐⭐</div>
        </div>`;
      break;

    case 'quiz-title':
      inner.innerHTML = `
        <div class="slide-quiz-title">
          <h2>🎯 DÀNH CHO PHỤ HUYNH</h2>
          <h1>QUIZ VUI</h1>
        </div>`;
      break;

    case 'quiz':
      inner.innerHTML = buildQuizSlide(data);
      break;

    case 'video':
      inner.innerHTML = `
        <div class="slide-closing">
          <div class="closing-icon">🎬</div>
          <h2>KỈ NIỆM</h2>
          <h1>VIDEO TỔNG KẾT NĂM HỌC</h1>
          <p>Nhìn lại một năm đầy ắp kỉ niệm của lớp 4B2 💕<br>Năm học 2025 – 2026</p>
        </div>`;
      break;
  }

  wrap.appendChild(inner);
  deck.appendChild(wrap);

  // Dot
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.onclick = () => goTo(idx);
  dotsEl.appendChild(dot);
}

function buildQuizSlide(d) {
  const opts = d.opts.map((t,i) => `
    <div class="q-opt" id="qopt-${d.id}-${i}" onclick="selectOpt(${d.id},${i},${i===d.ans})">
      <div class="opt-letter">${['A','B','C'][i]}</div>
      <div class="opt-text">${t}</div>
    </div>`).join('');
  return `
    <div class="slide-quiz-q">
      <div class="quiz-header">
        <span class="quiz-num">${d.num}</span>
        <div class="quiz-timer-area">
          <button class="q-btn btn-time" id="qbtn-${d.id}" onclick="toggleTimer(${d.id})">⏱ Bấm giờ</button>
          <span class="timer-val" id="qval-${d.id}"></span>
        </div>
      </div>
      <div class="q-text">${d.q}</div>
      <div class="quiz-opts">${opts}</div>
      <div class="quiz-footer">
        <button class="q-btn btn-reveal" onclick="revealAns(${d.id},${d.ans})">💡 Hiển thị đáp án</button>
        <div class="quiz-msg" id="qmsg-${d.id}"></div>
      </div>
    </div>`;
}

SLIDES.forEach((s,i) => buildSlide(s,i));

// ═══════════════════════════════
//  NAVIGATION
// ═══════════════════════════════
let cur = 0;
const total = SLIDES.length;
const timers = {};
const answered = {};

function goTo(idx, dir = 0) {
  if(idx < 0 || idx >= total) return;
  const prev = document.getElementById(`slide-${cur}`);
  const next = document.getElementById(`slide-${idx}`);
  if(!prev || !next) return;
  prev.classList.remove('active');
  prev.classList.add(dir >= 0 ? 'exit-left' : 'exit-right');
  setTimeout(() => prev.classList.remove('exit-left','exit-right'), 500);
  next.classList.add('active');
  // Pause timers when navigating away
  if(timers[cur]) { clearInterval(timers[cur]); timers[cur] = null; const bt = document.getElementById(`qbtn-${cur}`); if(bt) bt.classList.remove('running'); }
  cur = idx;
  updateUI();
}
function prev() { goTo(cur-1, -1); }
function next() { goTo(cur+1, 1); }

function updateUI() {
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===cur));
  document.querySelectorAll('.slide').forEach((s,i) => {
    if(i !== cur) s.classList.remove('active');
  });
  counterEl.textContent = `${cur+1} / ${total}`;
}

document.getElementById('prev').onclick = prev;
document.getElementById('next').onclick = next;
document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft' || e.key==='ArrowUp') prev();
  if(e.key==='ArrowRight' || e.key==='ArrowDown' || e.key===' ') { e.preventDefault(); next(); }
});
// Touch swipe
let touchX = 0;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 40) dx < 0 ? next() : prev();
});

// ═══════════════════════════════
//  QUIZ LOGIC
// ═══════════════════════════════
function toggleTimer(qi) {
  const btn = document.getElementById(`qbtn-${qi}`);
  const val = document.getElementById(`qval-${qi}`);
  if(timers[qi]) {
    clearInterval(timers[qi]); timers[qi]=null;
    btn.textContent='⏱ Bấm giờ'; btn.classList.remove('running');
    val.textContent=''; val.classList.remove('warn');
    return;
  }
  let s=30; val.textContent=s+'s'; val.style.color='#FFBD59';
  btn.textContent='⏹ Dừng'; btn.classList.add('running');
  timers[qi]=setInterval(()=>{
    s--;
    if(s<0){
      clearInterval(timers[qi]);timers[qi]=null;
      btn.textContent='⏱ Bấm giờ';btn.classList.remove('running');
      val.textContent='Hết giờ!';val.classList.remove('warn');
      return;
    }
    val.textContent=s+'s';
    if(s<=10){val.classList.add('warn');val.style.color='#FC8181';}
  },1000);
}

function selectOpt(qi,optIdx,isCorrect){
  if(answered[qi]) return;
  answered[qi]=true;
  if(timers[qi]){clearInterval(timers[qi]);timers[qi]=null;document.getElementById(`qbtn-${qi}`)?.classList.remove('running');}
  for(let i=0;i<3;i++){
    const el=document.getElementById(`qopt-${qi}-${i}`);
    if(!el) continue;
    el.style.pointerEvents='none';
    if(i===optIdx) el.classList.add(isCorrect?'correct':'wrong');
  }
  const msg=document.getElementById(`qmsg-${qi}`);
  if(isCorrect){
    msg.textContent='🎉 Chính xác!'; msg.className='quiz-msg ok show';
    confetti();
  } else {
    const ansOpt=document.getElementById(`qopt-${qi}-1`); // always B (index 1)
    if(ansOpt) ansOpt.classList.add('revealed');
    msg.textContent='😊 Chưa đúng! Đáp án đúng là B.'; msg.className='quiz-msg hint show';
  }
}

function revealAns(qi, ansIdx){
  if(timers[qi]){clearInterval(timers[qi]);timers[qi]=null;document.getElementById(`qbtn-${qi}`)?.classList.remove('running');}
  answered[qi]=true;
  for(let i=0;i<3;i++){
    const el=document.getElementById(`qopt-${qi}-${i}`);
    if(!el) continue;
    el.style.pointerEvents='none';
    if(i===ansIdx) el.classList.add('revealed');
    else el.style.opacity='.5';
  }
  const msg=document.getElementById(`qmsg-${qi}`);
  msg.textContent=`💡 Đáp án đúng: ${['A','B','C'][ansIdx]}`; msg.className='quiz-msg hint show';
}

// ═══════════════════════════════
//  CONFETTI
// ═══════════════════════════════
function confetti(){
  const cols=['#9CB286','#FFBD59','#FC8181','#60A5FA','#A78BFA'];
  for(let i=0;i<18;i++){
    const el=document.createElement('div');
    const sz=5+Math.random()*8;
    el.style.cssText=`position:fixed;left:${25+Math.random()*50}%;top:${15+Math.random()*25}%;
      width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*5)]};
      border-radius:${Math.random()>.5?'50%':'2px'};pointer-events:none;z-index:9999;
      animation:cfFall ${.8+Math.random()*.8}s ease-out ${Math.random()*.3}s forwards`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}
const cfStyle=document.createElement('style');
cfStyle.textContent='@keyframes cfFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(180px) rotate(540deg)}}';
document.head.appendChild(cfStyle);

// ═══════════════════════════════
//  INIT
// ═══════════════════════════════
document.getElementById(`slide-0`).classList.add('active');
updateUI();
</script>
